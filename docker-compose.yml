services:
  app:
    build: .
    container_name: natureanim-app
    working_dir: /var/www/html
    environment:
      # Ces variables surchargent le .env local (dotenv n'écrase pas
      # les variables d'environnement existantes).
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: natureanim
      DB_USERNAME: natureanim
      DB_PASSWORD: secret
      MAIL_MAILER: log
    volumes:
      - .:/var/www/html
      # Cache isolé : le conteneur ne doit pas réutiliser les caches de
      # routes/config générés sur l'hôte Windows (chemins absolus invalides).
      - /var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: natureanim-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: natureanim-mysql
    environment:
      MYSQL_DATABASE: natureanim
      MYSQL_USER: natureanim
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33061:3306" # accès depuis l'hôte si besoin
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
